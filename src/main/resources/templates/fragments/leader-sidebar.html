<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<!--
  Fragment: leaderSidebar(activeTab)
    activeTab : 'dashboard' | 'approvals' | 'assign' | 'report' | 'question-bank'
-->
<aside th:fragment="leaderSidebar(activeTab)" class="col">
  <div class="side">
    <div class="class-head">
      <div class="class-name">Trưởng môn</div>
      <div class="class-ma" th:if="${leaderSubject != null}"
           th:text="${leaderSubject.code() + ' — ' + leaderSubject.name()}">BM</div>
      <div class="class-ma" th:if="${leaderSubject == null}">Chưa gán môn học</div>
    </div>

    <div class="side-sep"></div>
    <p class="menu-title">Môn học</p>

    <ul class="side-nav">
      <li>
        <a th:href="@{/leader}"
           th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
          <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          Dashboard
        </a>
      </li>
      <li>
        <a th:href="@{/leader/assign}"
           th:classappend="${activeTab == 'assign'} ? 'active' : ''">
          <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m19 8 2 2-4 4h-2v-2l4-4Z"/></svg>
          Phân công GV
        </a>
      </li>
      <li>
        <a th:href="@{/leader/report}"
           th:classappend="${activeTab == 'report'} ? 'active' : ''">
          <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16V5"/></svg>
          Báo cáo
        </a>
      </li>
      <li>
        <a th:href="@{/leader/question-bank}"
           th:classappend="${activeTab == 'question-bank'} ? 'active' : ''">
          <svg class="ico" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 1 1 5.8 1c0 2-3 2-3 4M12 18h.01"/></svg>
          Ngân hàng câu hỏi
        </a>
      </li>
    </ul>
  </div>
</aside>
</html>
