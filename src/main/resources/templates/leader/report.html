<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Trưởng môn | Báo cáo', ~{::link.page-css})}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/class-detail.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/detail-page.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/admin.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/leader-subject.css}">
</head>
<body class="leader-page leader-report-page">
<header th:replace="~{fragments/app-header :: appHeader('leader')}"></header>

<div class="class-detail-layout leader-workspace">
  <aside th:replace="~{fragments/leader-sidebar :: leaderSidebar('report')}"></aside>

  <main class="col leader-main">
    <span id="flash-data"
          th:attr="data-flash-success=${flashSuccess},
                   data-flash-error=${flashError}"
          style="display:none;"></span>

    <div class="leader-page-heading leader-page-heading--icon">
      <span class="leader-heading-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16V5"/></svg>
      </span>
      <span>
        <h1 class="detail-title">Báo cáo môn học</h1>
        <p class="detail-sub">So sánh sĩ số và điểm trung bình theo lớp trong môn học.</p>
      </span>
    </div>

    <div th:if="${emptySubject}" class="admin-list-empty" role="status">
      Bạn chưa được gán môn học. Liên hệ quản trị viên để được chỉ định trưởng môn.
    </div>

    <section class="leader-report-section" th:if="${!emptySubject}">
      <div class="leader-section-heading">
        <h2>Kết quả theo lớp</h2>
        <span th:if="${reportRows != null}" th:text="${reportRows.size()} + ' lớp'">0 lớp</span>
      </div>
      <div th:if="${reportRows == null or reportRows.isEmpty()}" class="leader-empty-state">
        Chưa có lớp nào thuộc môn học.
      </div>
      <div class="leader-table-shell" th:if="${reportRows != null and !reportRows.isEmpty()}">
        <table class="leader-data-table leader-report-table">
          <thead>
            <tr>
              <th>Mã môn</th>
              <th>Tên lớp</th>
              <th>SV ACTIVE</th>
              <th>Điểm TB bài kiểm tra</th>
              <th>Điểm TB bài tập</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="row : ${reportRows}">
              <td data-label="Mã môn"><code class="leader-subject-code" th:text="${row.subjectCode()}">KOR311</code></td>
              <td data-label="Tên lớp"><strong th:text="${row.className()}">Tên</strong></td>
              <td data-label="SV ACTIVE" th:text="${row.activeEnrollments()}">0</td>
              <td data-label="Điểm TB bài kiểm tra">
                <span th:if="${row.avgTestScore() != null}"
                      th:text="${#numbers.formatDecimal(row.avgTestScore(), 1, 2)}">0.00</span>
                <span th:if="${row.avgTestScore() == null}" class="muted">—</span>
              </td>
              <td data-label="Điểm TB bài tập">
                <span th:if="${row.avgAssignmentScore() != null}"
                      th:text="${#numbers.formatDecimal(row.avgAssignmentScore(), 1, 2)}">0.00</span>
                <span th:if="${row.avgAssignmentScore() == null}" class="muted">—</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/leader-subject.js}"></script>
</body>
</html>
