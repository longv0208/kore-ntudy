<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Trưởng môn | Dashboard', ~{::link.page-css})}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/class-detail.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/detail-page.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/admin.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/leader-subject.css}">
</head>
<body class="leader-page leader-dashboard-page">
<header th:replace="~{fragments/app-header :: appHeader('leader')}"></header>

<div class="class-detail-layout leader-workspace">
  <aside th:replace="~{fragments/leader-sidebar :: leaderSidebar('dashboard')}"></aside>

  <main class="col leader-main">
    <span id="flash-data"
          th:attr="data-flash-success=${flashSuccess},
                   data-flash-error=${flashError}"
          style="display:none;"></span>

    <div class="leader-page-heading">
      <h1 class="detail-title">Dashboard môn học</h1>
      <p class="detail-sub" th:if="${leaderSubject != null}"
         th:text="'Tổng quan ' + ${leaderSubject.name()}">Tổng quan</p>
    </div>

    <div th:if="${emptySubject}" class="admin-list-empty" role="status">
      Bạn chưa được gán môn học. Liên hệ quản trị viên để được chỉ định trưởng môn.
    </div>

    <th:block th:if="${!emptySubject}">
      <section class="leader-kpi-grid" aria-label="Tổng quan môn học">
        <article class="leader-kpi-card">
          <span class="leader-kpi-icon leader-kpi-icon--blue" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m22 10-10-5-10 5 10 5 10-5Z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
          </span>
          <span class="leader-kpi-copy">
            <span class="leader-kpi-label">Lớp học</span>
            <strong class="leader-kpi-value" th:text="${kpis.classCount()}">0</strong>
          </span>
        </article>
        <article class="leader-kpi-card">
          <span class="leader-kpi-icon leader-kpi-icon--violet" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </span>
          <span class="leader-kpi-copy">
            <span class="leader-kpi-label">Giảng viên</span>
            <strong class="leader-kpi-value" th:text="${kpis.lecturerCount()}">0</strong>
          </span>
        </article>
        <article class="leader-kpi-card">
          <span class="leader-kpi-icon leader-kpi-icon--green" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </span>
          <span class="leader-kpi-copy">
            <span class="leader-kpi-label">Sinh viên (ACTIVE)</span>
            <strong class="leader-kpi-value" th:text="${kpis.studentCount()}">0</strong>
          </span>
        </article>
        <article class="leader-kpi-card">
          <span class="leader-kpi-icon leader-kpi-icon--orange" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>
          </span>
          <span class="leader-kpi-copy">
            <span class="leader-kpi-label">Câu hỏi đã duyệt</span>
            <strong class="leader-kpi-value" th:text="${kpis.approvedQuestionCount()}">0</strong>
          </span>
        </article>
      </section>

      <section class="leader-content-section leader-recent-classes">
        <div class="leader-section-heading">
          <h2>Lớp gần đây</h2>
          <span th:if="${recentClasses != null}" th:text="${recentClasses.size()} + ' lớp'">0 lớp</span>
        </div>
        <div th:if="${recentClasses == null or recentClasses.isEmpty()}" class="leader-empty-state">
          Chưa có lớp nào thuộc môn học.
        </div>
        <div class="leader-table-shell" th:if="${recentClasses != null and !recentClasses.isEmpty()}">
          <table class="leader-data-table">
            <thead>
              <tr>
                <th>Mã môn</th>
                <th>Tên lớp</th>
                <th>Giảng viên</th>
                <th>Trạng thái</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="c : ${recentClasses}">
                <td data-label="Mã môn"><code class="leader-subject-code" th:text="${c.code()}">KOR311</code></td>
                <td data-label="Tên lớp"><strong th:text="${c.name()}">Tên</strong></td>
                <td data-label="Giảng viên" th:text="${c.lecturerName()}">GV</td>
                <td data-label="Trạng thái">
                  <span class="leader-status-pill"
                        th:classappend="${' leader-status--' + #strings.toLowerCase(c.status())}"
                        th:text="${c.status()}">STATUS</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </th:block>
  </main>
</div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/leader-subject.js}"></script>
</body>
</html>
