<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${view.className()} + ' — Thành viên', ~{::link.page-css})}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/app-shell.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/student-lessons.css}">
  <link class="page-css" rel="stylesheet" th:href="@{/css/student-class-detail.css}">
</head>
<body>
<header th:replace="~{fragments/app-header :: appHeader('my-classes')}"></header>
<main class="student-lessons-shell student-class-detail-shell">
  <div class="student-class-detail-grid">
    <div th:replace="~{fragments/student-class-sidebar :: classSidebar('members', ${view.classId()}, ${view.className()}, ${view.classCode()}, ${view.lecturerName()}, ~{}, ~{})}"></div>
    <section class="student-class-detail-main">
      <div class="student-class-members-panel">
      <header class="student-class-detail-heading student-class-members-heading">
        <div>
          <p class="student-class-detail-eyebrow">Danh bạ lớp</p>
          <h2>Thành viên</h2>
          <p>Chọn “Nhắn tin” ngay tại một thành viên để mở cuộc trò chuyện riêng.</p>
        </div>
        <label class="student-class-member-search">
          <span class="sr-only">Tìm thành viên</span>
          <input type="search" placeholder="Tìm theo tên hoặc email..."
                 aria-label="Tìm thành viên" data-item-filter="#student-class-member-list">
        </label>
      </header>
      <div id="student-class-member-list" class="student-class-member-list">
        <article class="student-class-member-row" th:each="member : ${view.members()}"
                 data-filter-item
                 th:attr="data-filter-text=${member.name() + ' ' + member.email() + ' ' + member.roleLabel()}">
          <span class="student-class-member-avatar" th:text="${member.initial()}">S</span>
          <span class="student-class-member-identity">
            <strong th:text="${member.name()}">Thành viên</strong>
            <small th:text="${member.email()}">email@ksh.edu.vn</small>
          </span>
          <span class="student-class-member-role" th:text="${member.roleLabel()}">Sinh viên</span>
          <form th:if="${member.canMessage()}" method="post" th:action="@{/my/messages/new}">
            <input type="hidden" name="to" th:value="${member.userId()}">
            <button type="submit" class="student-class-message-btn">Nhắn tin</button>
          </form>
          <span class="student-class-member-you" th:unless="${member.canMessage()}">Bạn</span>
        </article>
      </div>
      </div>
    </section>
  </div>
</main>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/learning-select.js}"></script>
</body>
</html>
